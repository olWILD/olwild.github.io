<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>olWILD</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
        background: radial-gradient(circle at top, #1f274f 0%, #090b15 45%, #05060d 100%);
        color: #f5f8ff;
        overflow: hidden;
      }

      .aurora {
        position: fixed;
        inset: -30vmax;
        pointer-events: none;
        z-index: 0;
      }

      .aurora::before,
      .aurora::after {
        content: "";
        position: absolute;
        width: 45vmax;
        aspect-ratio: 1;
        border-radius: 50%;
        filter: blur(50px);
        opacity: 0.45;
        mix-blend-mode: screen;
        animation: drift 16s ease-in-out infinite alternate;
      }

      .aurora::before {
        background: radial-gradient(circle, #4c6fff 0%, #4c6fff00 65%);
        top: 20%;
        left: 15%;
      }

      .aurora::after {
        background: radial-gradient(circle, #4affd6 0%, #4affd600 65%);
        top: 45%;
        right: 10%;
        animation-duration: 20s;
      }

      main {
        position: relative;
        z-index: 1;
        width: min(90vw, 760px);
        padding: 3rem 2.5rem;
        text-align: center;
        border: 1px solid #ffffff21;
        border-radius: 28px;
        backdrop-filter: blur(12px);
        background: linear-gradient(145deg, #ffffff15, #ffffff05);
        box-shadow: 0 30px 80px #00000066;
        animation: float 6s ease-in-out infinite;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 4.5rem);
        letter-spacing: 0.02em;
      }

      p {
        margin: 0.85rem 0 0;
        font-size: clamp(1rem, 2vw, 1.35rem);
        color: #d8e1ff;
      }

      .sparkles {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 0;
      }

      .sparkles i {
        position: absolute;
        width: 0.35rem;
        aspect-ratio: 1;
        border-radius: 999px;
        background: #fff;
        opacity: 0.5;
        animation: twinkle var(--duration) ease-in-out infinite;
        animation-delay: var(--delay);
        top: var(--top);
        left: var(--left);
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      @keyframes drift {
        0% {
          transform: translate3d(-4vw, -3vh, 0) scale(1);
        }
        100% {
          transform: translate3d(5vw, 4vh, 0) scale(1.15);
        }
      }

      @keyframes twinkle {
        0%,
        100% {
          transform: scale(0.7);
          opacity: 0.3;
        }
        50% {
          transform: scale(1.4);
          opacity: 0.9;
        }
      }
    </style>
  </head>
  <body>
    <div class="aurora" aria-hidden="true"></div>
    <div class="sparkles" aria-hidden="true">
      <i style="--top: 12%; --left: 18%; --duration: 3.1s; --delay: -1.2s"></i>
      <i style="--top: 26%; --left: 68%; --duration: 4.4s; --delay: -0.6s"></i>
      <i style="--top: 40%; --left: 84%; --duration: 3.8s; --delay: -2.1s"></i>
      <i style="--top: 60%; --left: 14%; --duration: 4.9s; --delay: -1.4s"></i>
      <i style="--top: 72%; --left: 56%; --duration: 3.6s; --delay: -2.8s"></i>
      <i style="--top: 82%; --left: 28%; --duration: 4.2s; --delay: -0.9s"></i>
      <i style="--top: 20%; --left: 42%; --duration: 3.3s; --delay: -1.7s"></i>
      <i style="--top: 52%; --left: 74%; --duration: 4.7s; --delay: -2.5s"></i>
    </div>
    <main>
      <h1>Hi, I’m olWILD</h1>
      <p>Welcome to my profile site.</p>
    </main>
  </body>
</html>
